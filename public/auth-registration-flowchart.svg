<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 960" width="100%" height="100%" style="background-color: #F8FAFC; font-family: 'Prompt', 'Kanit', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="navyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E2538" />
      <stop offset="100%" stop-color="#2D3748" />
    </linearGradient>

    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06C755" />
      <stop offset="100%" stop-color="#05B34C" />
    </linearGradient>

    <linearGradient id="coralGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FB7170" />
      <stop offset="100%" stop-color="#FA5252" />
    </linearGradient>

    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.08" />
    </filter>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.12" />
    </filter>

    <!-- Arrow Markers -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#64748B" />
    </marker>
    <marker id="arrow-coral" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#FB7170" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#06C755" />
    </marker>
  </defs>

  <!-- Background Grid Pattern -->
  <g opacity="0.4">
    <path d="M 0,0 L 1200,0 M 0,80 L 1200,80 M 0,160 L 1200,160 M 0,240 L 1200,240 M 0,320 L 1200,320 M 0,400 L 1200,400 M 0,480 L 1200,480 M 0,560 L 1200,560 M 0,640 L 1200,640 M 0,720 L 1200,720 M 0,800 L 1200,800 M 0,880 L 1200,880" stroke="#E2E8F0" stroke-width="1" />
    <path d="M 0,0 L 0,960 M 120,0 L 120,960 M 240,0 L 240,960 M 360,0 L 360,960 M 480,0 L 480,960 M 600,0 L 600,960 M 720,0 L 720,960 M 840,0 L 840,960 M 960,0 L 960,960 M 1080,0 L 1080,960 M 1200,0 L 1200,960" stroke="#E2E8F0" stroke-width="1" />
  </g>

  <!-- ================= HEADER BANNER ================= -->
  <rect x="40" y="30" width="1120" height="90" rx="20" fill="url(#navyGrad)" filter="url(#cardShadow)" />
  
  <!-- Logo Icon Badge -->
  <rect x="65" y="48" width="54" height="54" rx="14" fill="#FFFFFF" />
  <circle cx="92" cy="75" r="16" fill="#1E2538" />
  <text x="92" y="80" fill="#FB7170" font-size="14" font-weight="900" text-anchor="middle">Y11</text>
  
  <!-- Header Text -->
  <text x="135" y="68" fill="#FFFFFF" font-size="22" font-weight="800" letter-spacing="-0.5">
    Young FTI ELITE 11 • LINE-First Auth &amp; Account Linking Flow
  </text>
  <text x="135" y="94" fill="#94A3B8" font-size="13" font-weight="500">
    สถาปัตยกรรมระบบยืนยันตัวตนสมาชิกผ่าน LINE LIFF, การค้นหาเบอร์โทรศัพท์, ตรวจสอบ OTP (123456) และระบบรออนุมัติ (Pending Approval)
  </text>

  <rect x="1010" y="55" width="125" height="40" rx="10" fill="#06C755" opacity="0.9" />
  <text x="1072" y="80" fill="#FFFFFF" font-size="12" font-weight="700" text-anchor="middle">LINE-First Mode</text>


  <!-- ================= SECTION 1: USER ENTRY & LIFF ================= -->
  <!-- Step 1 Node: User Access via LINE -->
  <g transform="translate(480, 160)" filter="url(#shadow)">
    <rect x="0" y="0" width="240" height="74" rx="16" fill="#06C755" />
    <text x="120" y="32" fill="#FFFFFF" font-size="13" font-weight="800" text-anchor="middle">1. เข้าสู่ระบบผ่าน LINE LIFF</text>
    <text x="120" y="52" fill="#E8F9EE" font-size="11" font-weight="500" text-anchor="middle">ดึง LINE Profile &amp; Auto-Sync</text>
  </g>

  <!-- Arrow: Step 1 -> Step 2 -->
  <path d="M 600,234 L 600,270" stroke="#06C755" stroke-width="2.5" marker-end="url(#arrow-green)" fill="none" />

  <!-- Step 2 Node: Phone Input Screen -->
  <g transform="translate(450, 275)" filter="url(#shadow)">
    <rect x="0" y="0" width="300" height="85" rx="16" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" />
    <rect x="15" y="12" width="28" height="28" rx="8" fill="#EFF6FF" />
    <text x="29" y="31" fill="#3B82F6" font-size="14" font-weight="800" text-anchor="middle">📱</text>
    
    <text x="52" y="30" fill="#1E2538" font-size="14" font-weight="800">2. ระบุเบอร์โทรศัพท์ (10 หลัก)</text>
    <text x="52" y="50" fill="#64748B" font-size="11" font-weight="500">กรอกเบอร์ที่ลงทะเบียนไว้กับโครงการ</text>
    <text x="52" y="68" fill="#F59E0B" font-size="10" font-weight="700">💡 มีปุ่ม Quick Test: 082-269-9962</text>
  </g>

  <!-- Arrow: Step 2 -> Decision Diamond -->
  <path d="M 600,360 L 600,405" stroke="#64748B" stroke-width="2.5" marker-end="url(#arrow)" fill="none" />


  <!-- ================= SECTION 2: DECISION POINT (SEARCH IN DIRECTORY) ================= -->
  <!-- Decision Diamond -->
  <g transform="translate(600, 470)">
    <!-- Polygon for Diamond -->
    <polygon points="0,-55 120,0 0,55 -120,0" fill="url(#navyGrad)" filter="url(#shadow)" stroke="#475569" stroke-width="2" />
    <text x="0" y="-8" fill="#FFFFFF" font-size="13" font-weight="800" text-anchor="middle">ค้นหาเบอร์ในระบบ?</text>
    <text x="0" y="12" fill="#94A3B8" font-size="11" font-weight="500" text-anchor="middle">(122 รายชื่อสมาชิก)</text>
  </g>


  <!-- ================= BRANCH A: MATCH FOUND (LEFT SIDE) ================= -->
  <!-- Path Left -->
  <path d="M 480,470 L 260,470 L 260,545" stroke="#06C755" stroke-width="2.5" marker-end="url(#arrow-green)" fill="none" />
  
  <!-- Condition Label: Yes (Found) -->
  <rect x="310" y="445" width="120" height="24" rx="6" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1" />
  <text x="370" y="461" fill="#065F46" font-size="11" font-weight="800" text-anchor="middle">✓ พบข้อมูลในระบบ</text>

  <!-- Step 3A Node: Display Matched Profile & Request OTP -->
  <g transform="translate(110, 550)" filter="url(#shadow)">
    <rect x="0" y="0" width="300" height="100" rx="16" fill="#FFFFFF" stroke="#06C755" stroke-width="2" />
    <rect x="16" y="14" width="32" height="32" rx="10" fill="#ECFDF5" />
    <text x="32" y="35" fill="#06C755" font-size="15" text-anchor="middle">🎯</text>
    
    <text x="58" y="32" fill="#1E2538" font-size="13" font-weight="800">3A. แสดงข้อมูลสมาชิกที่ตรงกัน</text>
    <text x="58" y="52" fill="#475569" font-size="11">แสดงชื่อ, บริษัท, ตำแหน่ง, กลุ่มดาว</text>
    
    <rect x="16" y="66" width="268" height="24" rx="6" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" />
    <text x="150" y="82" fill="#0F172A" font-size="10" font-weight="700" text-anchor="middle">ส่งรหัส OTP 6 หลักไปยังเบอร์มือถือ</text>
  </g>

  <!-- Arrow: 3A -> 4A -->
  <path d="M 260,650 L 260,695" stroke="#06C755" stroke-width="2.5" marker-end="url(#arrow-green)" fill="none" />

  <!-- Step 4A Node: Enter OTP 123456 -->
  <g transform="translate(110, 700)" filter="url(#shadow)">
    <rect x="0" y="0" width="300" height="90" rx="16" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" />
    <text x="150" y="28" fill="#1E2538" font-size="13" font-weight="800" text-anchor="middle">4A. กรอกรหัสยืนยัน OTP 6 หลัก</text>
    
    <rect x="60" y="38" width="180" height="26" rx="6" fill="#FEF3C7" stroke="#FDE68A" stroke-width="1" />
    <text x="150" y="55" fill="#92400E" font-size="11" font-weight="800" text-anchor="middle">🔑 รหัสทดสอบ: 123456</text>
    
    <text x="150" y="78" fill="#64748B" font-size="10" text-anchor="middle">ระบบตรวจสอบความถูกต้องของรหัส</text>
  </g>

  <!-- Arrow: 4A -> 5A -->
  <path d="M 260,790 L 260,835" stroke="#06C755" stroke-width="2.5" marker-end="url(#arrow-green)" fill="none" />

  <!-- Step 5A Node: Success & Link Account -->
  <g transform="translate(90, 840)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="340" height="95" rx="18" fill="url(#emeraldGrad)" />
    <text x="170" y="32" fill="#FFFFFF" font-size="15" font-weight="900" text-anchor="middle">🎉 5A. ผูกบัญชีสำเร็จ &amp; เข้าสู่ระบบ</text>
    <text x="170" y="54" fill="#E6FFFA" font-size="11" font-weight="500" text-anchor="middle">• ผูก LINE User ID เข้ากับ Profile สมาชิก</text>
    <text x="170" y="72" fill="#E6FFFA" font-size="11" font-weight="500" text-anchor="middle">• ปรับ Role: MEMBER + มอบ 100 Coins / 300 XP</text>
    <text x="170" y="87" fill="#FEF08A" font-size="10" font-weight="700" text-anchor="middle">Redirect ไปหน้าหลัก (/about)</text>
  </g>


  <!-- ================= BRANCH B: NOT FOUND -> PENDING APPROVAL (RIGHT SIDE) ================= -->
  <!-- Path Right -->
  <path d="M 720,470 L 940,470 L 940,545" stroke="#FB7170" stroke-width="2.5" marker-end="url(#arrow-coral)" fill="none" />
  
  <!-- Condition Label: No (Not Found) -->
  <rect x="760" y="445" width="130" height="24" rx="6" fill="#FFF1F2" stroke="#FECDD3" stroke-width="1" />
  <text x="825" y="461" fill="#9F1239" font-size="11" font-weight="800" text-anchor="middle">✕ ไม่พบเบอร์ในระบบ</text>

  <!-- Step 3B Node: Fill Basic Registration Form -->
  <g transform="translate(790, 550)" filter="url(#shadow)">
    <rect x="0" y="0" width="300" height="100" rx="16" fill="#FFFFFF" stroke="#FB7170" stroke-width="2" />
    <rect x="16" y="14" width="32" height="32" rx="10" fill="#FFF1F2" />
    <text x="32" y="35" fill="#FB7170" font-size="15" text-anchor="middle">📝</text>

    <text x="58" y="32" fill="#1E2538" font-size="13" font-weight="800">3B. กรอกข้อมูลขออนุมัติใช้งาน</text>
    <text x="58" y="52" fill="#475569" font-size="11">ระบุชื่อ-สกุล, บริษัท, ตำแหน่ง, กลุ่มดาว</text>
    
    <rect x="16" y="66" width="268" height="24" rx="6" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" />
    <text x="150" y="82" fill="#475569" font-size="10" font-weight="600" text-anchor="middle">Auto Pre-fill ชื่อจาก LINE Display Name</text>
  </g>

  <!-- Arrow: 3B -> 4B -->
  <path d="M 940,650 L 940,695" stroke="#FB7170" stroke-width="2.5" marker-end="url(#arrow-coral)" fill="none" />

  <!-- Step 4B Node: Submit to Supabase DB as PENDING -->
  <g transform="translate(790, 700)" filter="url(#shadow)">
    <rect x="0" y="0" width="300" height="90" rx="16" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" />
    <text x="150" y="28" fill="#1E2538" font-size="13" font-weight="800" text-anchor="middle">4B. บันทึกข้อมูลลงฐานข้อมูล</text>
    
    <rect x="50" y="38" width="200" height="26" rx="6" fill="#FEF3C7" stroke="#FDE68A" stroke-width="1" />
    <text x="150" y="55" fill="#92400E" font-size="11" font-weight="800" text-anchor="middle">⏳ กำหนด Role: PENDING</text>
    
    <text x="150" y="78" fill="#64748B" font-size="10" text-anchor="middle">บันทึกลงตาราง profiles รอการตรวจ</text>
  </g>

  <!-- Arrow: 4B -> 5B -->
  <path d="M 940,790 L 940,835" stroke="#FB7170" stroke-width="2.5" marker-end="url(#arrow-coral)" fill="none" />

  <!-- Step 5B Node: Pending Approval Screen -->
  <g transform="translate(770, 840)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="340" height="95" rx="18" fill="url(#amberGrad)" />
    <text x="170" y="32" fill="#FFFFFF" font-size="15" font-weight="900" text-anchor="middle">⏳ 5B. หน้าจอรอ Admin อนุมัติ</text>
    <text x="170" y="54" fill="#FFFBEB" font-size="11" font-weight="500" text-anchor="middle">• แสดงสถานะ Pending Approval Timeline</text>
    <text x="170" y="72" fill="#FFFBEB" font-size="11" font-weight="500" text-anchor="middle">• มีปุ่มติดต่อทีมงานผ่าน LINE Official</text>
    <text x="170" y="87" fill="#FFFFFF" font-size="10" font-weight="700" text-anchor="middle">Admin อนุมัติใน /admin เพื่อปลดล็อก</text>
  </g>

</svg>
